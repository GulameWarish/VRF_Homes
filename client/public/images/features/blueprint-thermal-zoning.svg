<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" fill="none">
  <defs>
    <pattern id="grid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284c7" stroke-width="0.5" opacity="0.25"/>
    </pattern>
    <pattern id="subgrid3" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="600" height="380" rx="16" fill="#0b2447"/>
  <rect width="600" height="380" fill="url(#grid3)"/>
  <rect width="600" height="380" fill="url(#subgrid3)"/>

  <!-- Title Block -->
  <rect x="25" y="20" width="550" height="35" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
  <text x="40" y="42" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">DWG NO: PLAN-ZON-03 // MULTI-ROOM INDEPENDENT THERMAL ZONING</text>
  <text x="495" y="42" font-family="monospace" font-size="11" fill="#7dd3fc">1:50</text>

  <!-- Architectural 2D Floor Plan Wall Lines (Double Line Walls) -->
  <rect x="50" y="80" width="500" height="250" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="55" y="85" width="490" height="240" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Internal Partition Walls -->
  <!-- Master Bedroom Partition -->
  <line x1="280" y1="85" x2="280" y2="240" stroke="#ffffff" stroke-width="3"/>
  <line x1="285" y1="85" x2="285" y2="240" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Living / Dining Partition -->
  <line x1="55" y1="235" x2="420" y2="235" stroke="#ffffff" stroke-width="3"/>
  <line x1="55" y1="240" x2="420" y2="240" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Zone 1: Master Suite -->
  <rect x="65" y="95" width="205" height="130" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">ZONE 01: MASTER SUITE</text>
  <!-- Thermostat symbol -->
  <circle cx="95" cy="160" r="16" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="87" y="165" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">20°</text>
  <text x="120" y="155" font-family="monospace" font-size="9" fill="#7dd3fc">NIGHT SLEEP SETPOINT</text>
  <text x="120" y="170" font-family="monospace" font-size="8" fill="#94a3b8">INDIVIDUAL DIGITAL THERMOSTAT</text>

  <!-- Zone 2: Formal Living Area -->
  <rect x="295" y="95" width="240" height="130" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="310" y="125" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">ZONE 02: FORMAL LIVING</text>
  <circle cx="325" cy="160" r="16" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="317" y="165" font-family="monospace" font-size="12" font-weight="bold" fill="#38bdf8">23°</text>
  <text x="350" y="155" font-family="monospace" font-size="9" fill="#7dd3fc">DAY COMFORT SETPOINT</text>
  <text x="350" y="170" font-family="monospace" font-size="8" fill="#94a3b8">OCCUPANCY SMART MODULATION</text>

  <!-- Zone 3: Dining & Family Foyer -->
  <rect x="65" y="250" width="345" height="65" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="275" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff">ZONE 03: DINING &amp; KITCHEN</text>
  <circle cx="95" cy="295" r="12" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="89" y="299" font-family="monospace" font-size="10" font-weight="bold" fill="#38bdf8">24°</text>
  <text x="115" y="298" font-family="monospace" font-size="9" fill="#7dd3fc">INDEPENDENT ZONE THERMOSTAT</text>

  <!-- Door Swings in Architectural Drafting -->
  <path d="M 280 180 A 30 30 0 0 1 250 210" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <line x1="280" y1="180" x2="280" y2="210" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Footer note -->
  <text x="35" y="358" font-family="monospace" font-size="9" fill="#94a3b8">INDIVIDUAL ROOM CONTROL: ZERO ENERGY WASTED ON UNOCCUPIED ROOMS</text>
</svg>