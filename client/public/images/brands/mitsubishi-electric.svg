<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="100%" height="100%">
  <!-- Mitsubishi Electric Authentic Logo -->
  <g transform="translate(10, 8)">
    <!-- 3 Red Diamonds -->
    <!-- Top Diamond -->
    <polygon points="22,2 29,14 22,26 15,14" fill="#e60012"/>
    <!-- Bottom Left Diamond -->
    <polygon points="11,21 18,33 11,45 4,33" fill="#e60012"/>
    <!-- Bottom Right Diamond -->
    <polygon points="33,21 40,33 33,45 26,33" fill="#e60012"/>

    <!-- Wordmark -->
    <text x="50" y="21" font-family="'Arial Black', 'Helvetica', sans-serif" font-size="14" font-weight="900" fill="#000000" letter-spacing="1.5">MITSUBISHI</text>
    <text x="50" y="36" font-family="'Arial', 'Helvetica', sans-serif" font-size="12" font-weight="800" fill="#000000" letter-spacing="2.5">ELECTRIC</text>
    <text x="50" y="44" font-family="'Segoe UI', sans-serif" font-size="6" font-style="italic" fill="#666666">Changes for the Better</text>
  </g>
</svg>
