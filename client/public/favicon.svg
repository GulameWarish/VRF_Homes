<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Luxury Midnight Navy -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="60%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan Electric Gradient -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009fe3"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <!-- VRF Metallic Lettering Gradient -->
    <linearGradient id="favText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#009fe3"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container Badge -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" stroke="url(#favCyan)" stroke-width="2"/>

  <!-- Architectural House Roof Apex (HOME) -->
  <path d="M 11 26 L 32 8 L 53 26" stroke="#009fe3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Ventilation / HVAC Chimney -->
  <path d="M 43 14 V 9.5 H 47 V 17.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 18 25 L 32 13.5 L 46 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9"/>

  <!-- Big Bold VRF Brand Wordmark (Max Visibility in 16x16 / 32x32 Tab) -->
  <text x="32" y="44" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="20" 
        fill="url(#favText)" 
        text-anchor="middle" 
        letter-spacing="0.5">VRF</text>

  <!-- HOME Subtitle -->
  <text x="32" y="55" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-weight="800" 
        font-size="9" 
        fill="#ffffff" 
        text-anchor="middle" 
        letter-spacing="3.5">HOME</text>

  <!-- Dynamic Cooling Airflow Line -->
  <path d="M 15 59.5 C 23 57.5, 27 61.5, 35 59.5 C 41 57.5, 45 60.5, 49 59.5" 
        stroke="#00e5ff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85"/>
</svg>
