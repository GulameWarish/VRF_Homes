<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Deep Luxury Navy to Midnight -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071120"/>
      <stop offset="50%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan Glow Gradient for Outline & House Peak -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009fe3"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Metallic VRF Text Gradient -->
    <linearGradient id="vrfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="url(#cyanGrad)" stroke-width="1.8" stroke-opacity="0.75"/>

  <!-- Architectural House Roof Apex (HOME) -->
  <path d="M 10 27 L 32 8 L 54 27" stroke="url(#cyanGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Subtle inner roof accent with HVAC chimney / airflow chimney -->
  <path d="M 43 14.5 V 10 H 47 V 18" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 18 26 L 32 14 L 46 26" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- Bold Brand Monogram: VRF -->
  <text x="32" y="43" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="900" 
        font-style="italic" 
        font-size="18" 
        fill="url(#vrfGrad)" 
        text-anchor="middle" 
        letter-spacing="0.5"
        style="text-shadow: 0 2px 6px rgba(0, 159, 227, 0.6);">VRF</text>

  <!-- Clean Subtitle: HOME -->
  <text x="32" y="55" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="8.5" 
        fill="#f8fafc" 
        text-anchor="middle" 
        letter-spacing="3.2">HOME</text>

  <!-- Dynamic Cooling Airflow Wave at Bottom -->
  <path d="M 16 59 C 24 57, 28 61, 36 59 C 42 57, 46 60, 48 59" stroke="#009fe3" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>